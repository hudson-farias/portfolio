name: CI/CD - Portfolio Api

on:
  push:
    branches:
      - main
    paths:
      - "apps/backend/**"
      - "infrastructure/**"
      - ".github/workflows/ci-cd.yml"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Connect, pull and re-build
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} 'bash -s' <<'EOF'
          set -euo pipefail
          cd portfolio/portfolio-api
          git pull
          if [ -f .env ] && [ ! -f apps/backend/.env ]; then
            mv .env apps/backend/.env
          fi
          if docker compose version >/dev/null 2>&1; then
            COMPOSE=(docker compose)
          else
            COMPOSE=(docker-compose)
          fi
          nohup "${COMPOSE[@]}" -p portfolio-api --env-file apps/backend/.env -f infrastructure/docker-compose.yml up -d --build --remove-orphans > deploy.log 2>&1 &
          disown || true
          EOF
