# API + PostgreSQL na VPS.
# A partir da raiz do repo (caminhos relativos a este arquivo):
#   docker compose -p portfolio-api --env-file apps/backend/.env -f infrastructure/docker-compose.yml up -d --build
#
# -p portfolio-api mantém o volume portfolio-api_postgres_data do Compose antigo.

name: portfolio-api

x-backend: &backend
  build:
    context: ../apps/backend
    dockerfile: Dockerfile
  env_file:
    - ../apps/backend/.env
  extra_hosts:
    - "host.docker.internal:host-gateway"
  restart: always

services:
  api:
    <<: *backend
    ports:
      - "8000:8000"
    depends_on:
      - db

  db:
    image: postgres:15
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
